{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Quyền truy cập bị từ chối | PoolFinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0505; /* Nền vũ trụ đỏ thẫm */
        }
        /* Hiệu ứng trôi nổi đồng bộ với 404 */
        .float-anim {
            animation: floating 6s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        /* Hiệu ứng hào quang cảnh báo */
        .warning-glow {
            filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.4));
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white overflow-hidden relative">
    
    <div class="absolute inset-0 z-0 opacity-30 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>

    <div class="max-w-3xl w-full px-6 text-center flex flex-col items-center relative z-10">
        
        <div class="float-anim mb-8">
            <div class="relative inline-block">
                <img src="https://cdn-icons-png.flaticon.com/512/2592/2592317.png" alt="Forbidden Space" class="w-48 md:w-64 warning-glow">
                <div class="absolute inset-0 border-4 border-red-500/30 rounded-full animate-pulse scale-125"></div>
            </div>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400 tracking-wide uppercase">
            TRẠM KIỂM SOÁT TỪ CHỐI!
        </h1>
        
        <p class="text-lg text-gray-400 mb-10 leading-relaxed max-w-xl mx-auto">
            Xin lỗi phi hành gia, tọa độ khu vực này nằm ngoài quyền hạn truy cập của bạn. 
            Vui lòng xuất trình thẻ **Admin** hoặc quay lại vùng an toàn.
        </p>

        <div class="flex flex-col sm:flex-row gap-4">
            <a href="{% url 'home' %}" class="px-8 py-4 bg-gradient-to-r from-gray-700 to-gray-900 hover:from-gray-600 hover:to-gray-800 text-white rounded-full font-bold shadow-lg transition-all duration-300 flex items-center justify-center gap-3 border border-gray-600">
                <i class="fas fa-undo"></i> Quay lại
            </a>
            
            <a href="{% url 'login_admin' %}" class="px-8 py-4 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white rounded-full font-bold shadow-lg shadow-red-500/30 hover:shadow-red-500/50 hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-3">
                <i class="fas fa-user-shield"></i> Đăng nhập Admin
            </a>
        </div>

    </div>

    <div class="absolute -top-24 -left-24 w-96 h-96 bg-red-900/20 rounded-full blur-[100px]"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-orange-900/10 rounded-full blur-[100px]"></div>

</body>
</html>
