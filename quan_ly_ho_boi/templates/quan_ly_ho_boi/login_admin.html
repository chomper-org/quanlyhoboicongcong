{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'admin/simpleui-x/elementui/theme-chalk/index.css' %}">
    <link rel="stylesheet" href="{% static 'admin/simpleui-x/css/login.css' %}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #e2e8f0;
            background: radial-gradient(circle at top left, rgba(59,130,246,0.35), transparent 25%),
                        radial-gradient(circle at bottom right, rgba(16,185,129,0.3), transparent 20%),
                        linear-gradient(135deg, #0f172a, #111827);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .background-panel {
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            opacity: 0.16;
            z-index: -1;
            filter: brightness(0.65);
        }
        .login-container {
            width: min(100%, 520px);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 32px 120px rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(18px);
        }
        .login-panel {
            display: grid;
            gap: 0;
        }
        .login-header {
            padding: 36px 32px 0;
            text-align: center;
        }
        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .login-header p {
            color: #94a3b8;
            margin: 0;
            max-width: 14rem;
            margin-left: auto;
            margin-right: auto;
        }
        .panel-badge {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #22c55e, #2563eb);
            margin-bottom: 20px;
            color: white;
            font-size: 1.35rem;
        }
        .form-card {
            padding: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(15, 23, 42, 0.65);
            color: #f8fafc;
            font-size: 0.95rem;
        }
        .form-control:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16);
            background: rgba(15, 23, 42, 0.8);
        }
        .btn-login {
            width: 100%;
            padding: 15px 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #22c55e);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }
        .alert {
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 22px;
            background: rgba(248, 113, 113, 0.14);
            color: #fecaca;
            border: 1px solid rgba(248, 113, 113, 0.28);
        }
        .back-link {
            margin-top: 24px;
            text-align: center;
        }
        .back-link a {
            color: #7dd3fc;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .back-link a:hover {
            color: #a5f3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="background-panel"></div>
    <div class="login-container">
        <div class="login-panel">
            <div class="login-header">
                <div class="panel-badge">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1>Admin Panel</h1>
                <p>Đăng nhập để truy cập bảng điều khiển quản trị hồ bơi.</p>
            </div>
            <div class="form-card">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text" id="username" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt mr-2"></i>Đăng nhập
                    </button>
                </form>

                <div class="back-link">
                    <a href="{% url 'home' %}"><i class="fas fa-arrow-left mr-2"></i>Về trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
