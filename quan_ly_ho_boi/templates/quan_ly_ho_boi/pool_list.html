<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Hồ bơi | PoolFinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <nav class="bg-white shadow-md z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <span class="text-xl font-bold text-blue-600"><i class="fas fa-swimming-pool mr-2"></i>PoolFinder</span>
                </div>
                <div class="flex items-center gap-6">
                    <a href="{% url 'home' %}" class="text-gray-600 hover:text-blue-600 transition font-medium">Trang chủ</a>
                    <a href="{% url 'gioi_thieu' %}" class="text-gray-600 hover:text-blue-600 transition font-medium">Giới thiệu</a>
                    <a href="{% url 'map' %}" class="text-gray-600 hover:text-blue-600 transition font-medium">Bản đồ GIS</a>
                     <a href="{% url 'pool_list' %}" class="text-blue-600 font-bold border-b-2 border-blue-600 transition">Danh sách</a>
                </div>
                <div class="flex items-center gap-4">
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-lg transition font-medium"><i class="fas fa-user mr-2"></i>{{ user.username }}</a>
                    {% else %}
                        <a href="{% url 'login_user' %}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">Đăng nhập</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Danh sách Hồ bơi</h1>
                <p class="text-gray-500 mt-1">Khám phá và đánh giá các hồ bơi công cộng chất lượng</p>
            </div>
            
            <div class="flex gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-64">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" placeholder="Tìm tên hồ bơi..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
                <select class="border border-gray-300 rounded-lg px-4 py-2 bg-white focus:outline-none text-gray-700">
                    <option>Sắp xếp: Đánh giá cao</option>
                    <option>Sắp xếp: Giá thấp nhất</option>
                    <option>Sắp xếp: Mới nhất</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
