<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin-when-cross-origin">
    <title>Bản đồ GIS | WebGIS Quản lý Hồ bơi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        .leaflet-popup-content { margin: 12px; width: 280px !important; }
        .leaflet-control-layers { border-radius: 8px !important; border: none !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1) !important; }
        .suggestion-item { padding: 8px 16px; cursor: pointer; border-bottom: 1px solid #e5e7eb; }
        .suggestion-item:hover { background-color: #f3f4f6; }
        .suggestion-item:last-child { border-bottom: none; }
        /* CSS cho ngôi sao đánh giá */
        .rating-stars .fa-star.active {color: #fbbf24; }
        .rating-stars .fa-star:hover {color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen overflow-hidden">
    
    <nav class="bg-white shadow-md z-50 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <span class="text-xl font-bold text-blue-600"><i class="fas fa-swimming-pool mr-2"></i>PoolFinder</span>
                </div>
                <div class="flex items-center gap-6">
                    <a href="{% url 'home' %}" class="text-gray-600 hover:text-blue-600 transition font-medium">Trang chủ</a>
                    <a href="{% url 'map' %}" class="text-blue-600 font-bold border-b-2 border-blue-600 transition">Bản đồ GIS</a>
                    <a href="{% url 'pool_list' %}" class="text-gray-600 hover:text-blue-600 transition font-medium">Danh sách</a>
                </div>
                <div class="flex items-center gap-4">
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-lg transition font-medium"><i class="fas fa-user mr-2"></i>{{ user.username }}</a>
                        <a href="{% url 'logout_user' %}" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-medium">Đăng xuất</a>
                    {% else %}
                        <a href="{% url 'login_user' %}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">Đăng nhập</a>
                        <a href="{% url 'register_user' %}" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">Đăng ký</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 relative z-0">
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] flex gap-2 w-full max-w-2xl px-4">
            <div class="flex-1 bg-white rounded-lg shadow-lg border border-gray-200 relative">
                <div class="flex items-center px-4 py-2">
                    <i class="fas fa-search text-gray-400 mr-2"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên hoặc địa chỉ..." class="w-full outline-none text-sm text-gray-700" autocomplete="off">
                </div>
                <div id="suggestions" class="absolute top-full left-0 right-0 bg-white border border-gray-200 rounded-b-lg shadow-lg max-h-60 overflow-y-auto hidden z-10">
                    </div>
            </div>
            <select id="statusFilter" class="bg-white rounded-lg shadow-lg px-4 py-2 outline-none text-sm border border-gray-200 text-gray-700 font-medium">
                <option value="ALL">Tất cả trạng thái</option>
                <option value="MO">Đang mở cửa</option>
                <option value="DONG">Đóng cửa</option>
            </select>
            <button id="resetBtn" class="bg-white hover:bg-blue-50 text-blue-600 px-4 py-2 rounded-lg shadow-lg border border-gray-200 transition flex items-center gap-2" title="Làm mới & Định vị">
                <i class="fas fa-sync-alt" id="resetIcon"></i>
                <span class="text-xs font-bold hidden sm:inline">Làm mới</span>
            </button>
        </div>

        <div class="absolute top-20 right-4 z-[1000]">
            <div class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg font-bold text-sm">
                Hiển thị: <span id="poolCounter" class="ml-1 text-yellow-300">0</span>
            </div>
        </div>

        <div id="leaflet-map" class="w-full h-full"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
            
            const map = L.map('leaflet-map', {
                center: [10.7769, 106.6964], 
                zoom: 13,
                layers: [osmLayer]
            });

            L.control.layers({"Bản đồ chuẩn": osmLayer, "Vệ tinh": satelliteLayer}).addTo(map);
            L.control.scale({metric: true, imperial: false}).addTo(map);

            let allPoolsData = [];
            let markerGroup = L.featureGroup().addTo(map);
            let userMarker = null;

            function getCustomIcon(statusCode) {
                let color = statusCode === 'MO' ? 'green' : 'red';
                return new L.Icon({
                    iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                });
            }

            // --- BẮT ĐẦU: Hàm Render Marker đã tích hợp Đánh Giá ---
            function renderMarkers(pools) {
                markerGroup.clearLayers();
                pools.forEach(feature => {
                    const coords = feature.geometry.coordinates;
                    const props = feature.properties;
                    const marker = L.marker([coords[1], coords[0]], {icon: getCustomIcon(props.status_code)});
                    
                    let imgHtml = props.image ? `<img src="${props.image}" class="w-full h-32 object-cover rounded-t-lg mb-2">` : `<div class="w-full h-32 bg-blue-100 flex items-center justify-center rounded-t-lg mb-2 text-blue-300"><i class="fas fa-image text-3xl"></i></div>`;
                    let statusHtml = props.status_code === 'MO' ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Đang mở</span>` : `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">Đóng cửa</span>`;
                    
                    // Form đánh giá
                    let ratingHtml = `
                        <div class="mt-4 pt-3 border-t border-gray-100">
                            <p class="text-xs font-bold text-gray-700 mb-2">Đánh giá hồ bơi này:</p>
                            <div class="flex flex-col gap-2">
                                <div class="rating-stars text-gray-300 text-lg flex gap-1 cursor-pointer">
                                    <i class="fas fa-star star-btn hover:text-yellow-400 transition" data-value="1"></i>
                                    <i class="fas fa-star star-btn hover:text-yellow-400 transition" data-value="2"></i>
                                    <i class="fas fa-star star-btn hover:text-yellow-400 transition" data-value="3"></i>
                                    <i class="fas fa-star star-btn hover:text-yellow-400 transition" data-value="4"></i>
                                    <i class="fas fa-star star-btn hover:text-yellow-400 transition" data-value="5"></i>
                                </div>
                                <input type="hidden" id="rating-value-${props.id}" value="0">
                                <textarea id="comment-${props.id}" class="text-xs border rounded p-2 outline-none focus:border-blue-500 w-full resize-none" rows="2" placeholder="Viết cảm nhận..."></textarea>
                                <button onclick="window.submitReview(${props.id})" class="bg-green-600 text-white text-xs py-1.5 rounded shadow hover:bg-green-700 transition font-bold w-full">Gửi đánh giá</button>
                            </div>
                        </div>
                    `;

                    const popupContent = `
                        <div class="popup-container -m-3">
                            ${imgHtml}
                            <div class="px-3 pb-3">
                                <h5 class="font-bold text-lg text-gray-900 leading-tight mb-1">${props.name}</h5>
                                <p class="text-xs text-gray-500 mb-2 truncate"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i>${props.address}</p>
                                <div class="flex justify-between items-center mb-4">${statusHtml}<span class="text-sm font-bold text-blue-600">${props.price_adult}đ/vé</span></div>
                                <a href="/dat-ve/${props.id}/" class="block w-full text-center bg-blue-600 text-white py-2 rounded shadow hover:bg-blue-700 transition font-medium text-sm">Đặt vé ngay</a>
                                ${ratingHtml}
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                    markerGroup.addLayer(marker);
                });
                document.getElementById('poolCounter').innerText = pools.length;
            }
            // --- KẾT THÚC: Hàm Render Marker ---

            function locateUser(isInitial = false) {
                if ("geolocation" in navigator) {
                    const icon = document.getElementById('resetIcon');
                    if (icon) icon.classList.add('fa-spin');

                    navigator.geolocation.getCurrentPosition(position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        if (userMarker) map.removeLayer(userMarker);
                        
                        const userIcon = new L.Icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                            iconSize: [25, 41], iconAnchor: [12, 41]
                        });
                        
                        userMarker = L.marker([lat, lng], {icon: userIcon}).addTo(map).bindPopup('<b>Vị trí của bạn</b>');
                        map.setView([lat, lng], 14);
                        if (icon) icon.classList.remove('fa-spin');
                    }, error => {
                        if (!isInitial) alert("Không thể lấy vị trí. Vui lòng kiểm tra quyền truy cập vị trí.");
                        if (icon) icon.classList.remove('fa-spin');
                    });
                }
            }

            fetch('{% url "get_pools" %}')
                .then(response => response.json())
                .then(data => {
                    allPoolsData = data.features;
                    renderMarkers(allPoolsData);
                    locateUser(true); 
                });

            function applyFilters() {
                let searchText = document.getElementById('searchInput').value.toLowerCase();
                let statusVal = document.getElementById('statusFilter').value;
                let filtered = allPoolsData.filter(f => {
                    let matchT = f.properties.name.toLowerCase().includes(searchText) || f.properties.address.toLowerCase().includes(searchText);
                    let matchS = (statusVal === 'ALL') || (f.properties.status_code === statusVal);
                    return matchT && matchS;
                });
                renderMarkers(filtered);
            }

            function showSuggestions(filteredPools) {
                const suggestionsDiv = document.getElementById('suggestions');
                suggestionsDiv.innerHTML = '';
                if (filteredPools.length > 0 && document.getElementById('searchInput').value.trim() !== '') {
                    filteredPools.slice(0, 5).forEach(pool => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerHTML = `<strong>${pool.properties.name}</strong><br><small class="text-gray-500">${pool.properties.address}</small>`;
                        div.addEventListener('click', () => {
                            selectSuggestion(pool);
                        });
                        suggestionsDiv.appendChild(div);
                    });
                    suggestionsDiv.classList.remove('hidden');
                } else {
                    suggestionsDiv.classList.add('hidden');
                }
            }

            function hideSuggestions() {
                document.getElementById('suggestions').classList.add('hidden');
            }

            function selectSuggestion(pool) {
                document.getElementById('searchInput').value = pool.properties.name;
                hideSuggestions();
                zoomToPool(pool);
            }

            function zoomToPool(pool) {
                const coords = pool.geometry.coordinates;
                map.flyTo([coords[1], coords[0]], 16, {
                    duration: 1.5, 
                    easeLinearity: 0.25 
                });
                setTimeout(() => {
                    markerGroup.eachLayer(layer => {
                        if (layer.getLatLng().lat === coords[1] && layer.getLatLng().lng === coords[0]) {
                            layer.openPopup();
                        }
                    });
                }, 1500);
            }

            document.getElementById('searchInput').addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                if (query === '') {
                    hideSuggestions();
                    applyFilters();
                    return;
                }
                const filtered = allPoolsData.filter(pool =>
                    pool.properties.name.toLowerCase().includes(query) ||
                    pool.properties.address.toLowerCase().includes(query)
                );
                showSuggestions(filtered);
                applyFilters();
            });

            document.getElementById('searchInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const query = this.value.toLowerCase().trim();
                    if (query !== '') {
                        const exactMatch = allPoolsData.find(pool =>
                            pool.properties.name.toLowerCase() === query
                        );
                        if (exactMatch) {
                            zoomToPool(exactMatch);
                        } else {
                            const firstMatch = allPoolsData.find(pool =>
                                pool.properties.name.toLowerCase().includes(query) ||
                                pool.properties.address.toLowerCase().includes(query)
                            );
                            if (firstMatch) {
                                zoomToPool(firstMatch);
                            }
                        }
                    }
                    hideSuggestions();
                }
            });

            document.addEventListener('click', function(e) {
                const searchContainer = document.querySelector('.flex-1.bg-white');
                if (!searchContainer.contains(e.target)) {
                    hideSuggestions();
                }
            });

            document.getElementById('statusFilter').addEventListener('change', applyFilters);

            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('statusFilter').value = 'ALL';
                renderMarkers(allPoolsData);
                locateUser(); 
            });

            // --- BẮT ĐẦU: Xử lý hiệu ứng click chọn sao ---
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('star-btn')) {
                    const rating = parseInt(e.target.getAttribute('data-value'));
                    const parent = e.target.parentElement;
                    
                    // Lấy thẻ input ẩn ngay dưới khu vực chọn sao
                    const hiddenInput = parent.nextElementSibling;
                    hiddenInput.value = rating;
                    
                    // Đổi màu các ngôi sao
                    const stars = parent.querySelectorAll('.star-btn');
                    stars.forEach(s => {
                        if (parseInt(s.getAttribute('data-value')) <= rating) {
                            s.classList.add('active');
                        } else {
                            s.classList.remove('active');
                        }
                    });
                }
            });
            // --- KẾT THÚC: Xử lý hiệu ứng click chọn sao ---

        }); // Kết thúc block DOMContentLoaded

        // --- BẮT ĐẦU: Hàm gửi dữ liệu về Django ---
        // Đặt ngoài DOMContentLoaded để html nội tuyến onclick="window.submitReview()" có thể gọi được
        window.submitReview = function(poolId) {
            const rating = document.getElementById(`rating-value-${poolId}`).value;
            const comment = document.getElementById(`comment-${poolId}`).value;

            if (rating === "0") {
                alert("Vui lòng chọn số sao (1-5) trước khi gửi!");
                return;
            }

            // Lấy CSRF token của Django từ cookie
            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }

            fetch('/submit-review/', { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    pool_id: poolId,
                    rating: parseInt(rating),
                    comment: comment
                })
            })
            .then(response => {
                if (response.status === 403) {
                    alert("Bạn cần đăng nhập để thực hiện chức năng này!");
                    throw new Error("Chưa đăng nhập");
                }
                return response.json();
            })
            .then(data => {
                if (data && data.status === 'success') {
                    alert("Đánh giá của bạn đã được ghi nhận. Xin cảm ơn!");
                    // Reset lại giá trị
                    document.getElementById(`rating-value-${poolId}`).value = 0;
                    document.getElementById(`comment-${poolId}`).value = "";
                    const parent = document.getElementById(`rating-value-${poolId}`).previousElementSibling;
                    const stars = parent.querySelectorAll('.star-btn');
                    stars.forEach(s => s.classList.remove('active'));
                    
                    // Có thể tự động đóng popup bản đồ (tùy chọn)
                    // map.closePopup(); 
                } else if (data) {
                    alert("Đã xảy ra lỗi: " + (data.message || "Lỗi không xác định"));
                }
            })
            .catch(error => console.log('Lỗi gửi đánh giá:', error));
        };
        // --- KẾT THÚC: Hàm gửi dữ liệu ---

    </script>

    <footer class="bg-gray-800 text-white py-4">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-400 text-sm">
                <a href="{% url 'login_admin' %}" class="hover:text-gray-300 transition">Dành cho Ban quản trị</a>
            </p>
        </div>
    </footer>
</body>
</html>
