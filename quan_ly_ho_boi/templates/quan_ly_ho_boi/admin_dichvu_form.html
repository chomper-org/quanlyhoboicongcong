<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Ghi đè form-control bootstrap class created in forms.py */
        .form-control {
            width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem 1rem; color: #f1f5f9; outline: none; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #3b82f6; }
    </style>
</head>
<body class="bg-[#0f172a] text-gray-200 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-2xl">
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            </div>
            <a href="{% url 'dichvu_list' %}" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-700 text-white rounded-xl hover:bg-slate-600 transition">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="bg-[#1e293b] p-8 rounded-3xl border border-gray-800 shadow-lg">
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
                        {% endif %}
                        {% for error in field.errors %}
                            <p class="text-sm text-red-400 mt-1"><i class="fas fa-exclamation-circle mr-1"></i>{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
                <div class="pt-4 flex gap-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition">
                        Lưu thông tin
                    </button>
                    <a href="{% url 'admin_panel' %}?tab=tab-services" class="flex-1 text-center border border-gray-700 text-gray-300 hover:bg-slate-800 font-bold py-3 px-4 rounded-xl transition">
                        Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
