<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang | PoolFinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19; /* Nền vũ trụ sâu thẳm */
        }
        /* Hiệu ứng trôi nổi cho hành tinh */
        .float-anim {
            animation: floating 6s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white overflow-hidden relative">
    
    <div class="absolute inset-0 z-0 opacity-40 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>

    <div class="max-w-3xl w-full px-6 text-center flex flex-col items-center relative z-10">
        
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 tracking-wide">
            OOPS! BẠN LẠC VÀO HỐ ĐEN RỒI
        </h1>
        <p class="text-lg text-gray-400 mb-10 leading-relaxed max-w-xl mx-auto">
            Hành tinh mang tên trang web này không tồn tại trong hệ mặt trời của chúng tôi. 
            Hãy kích hoạt động cơ khẩn cấp để quay về quỹ đạo an toàn nhé!
        </p>

        <a href="{% url 'home' %}" class="px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-full font-bold shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:-translate-y-1 transition-all duration-300 flex items-center gap-3 text-lg">
            <i class="fas fa-rocket"></i> Trở về Sảnh chính
        </a>

    </div>
</body>
</html>
