<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa vé đặt | PoolManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-gray-200 font-sans min-h-screen">
    <div class="max-w-4xl mx-auto py-10 px-6">
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white">Chỉnh sửa vé đặt</h1>
                <p class="text-gray-400 mt-2">Mã vé: #{{ dat_ve.id }} | Hồ bơi: {{ dat_ve.ho_boi.ten_ho }}</p>
            </div>
            <a href="{% url 'admin_panel' %}" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-700 text-white rounded-xl hover:bg-slate-600 transition">
                <i class="fas fa-arrow-left"></i> Quay về Admin
            </a>
        </div>

        {% if messages %}
        <div class="mb-6 space-y-3">
            {% for message in messages %}
            <div class="rounded-2xl border px-4 py-3 text-sm font-medium {% if message.tags == 'success' %}border-emerald-500 bg-emerald-500/10 text-emerald-200{% elif message.tags == 'error' %}border-red-500 bg-red-500/10 text-red-200{% else %}border-gray-700 bg-slate-800 text-gray-200{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="bg-[#1e293b] rounded-3xl border border-gray-800 p-8 shadow-lg">
            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Ngày sử dụng</label>
                        {{ form.ngay_su_dung }}
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Số lượng người lớn</label>
                        {{ form.so_luong_nguoi_lon }}
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Số lượng trẻ em</label>
                        {{ form.so_luong_tre_em }}
                    </div>
                </div>

                <div class="mt-8 flex items-center gap-4">
                    <button type="submit" class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition">
                        <i class="fas fa-save"></i> Lưu cập nhật
                    </button>
                    <a href="{% url 'admin_panel' %}" class="inline-flex items-center gap-2 px-6 py-3 border border-gray-700 rounded-xl text-gray-200 hover:bg-gray-800 transition">
                        Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
