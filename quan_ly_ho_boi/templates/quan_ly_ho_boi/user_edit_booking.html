<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa vé | PoolFinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <i class="fas fa-swimming-pool text-2xl text-blue-600"></i>
                    <span class="text-xl font-bold text-gray-800">PoolFinder</span>
                </div>
                <a href="{% url 'profile' %}" class="text-gray-500 hover:text-blue-600 transition font-medium">
                    <i class="fas fa-arrow-left mr-1"></i> Quay lại Profile
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 w-full max-w-xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 text-blue-600 mb-4">
                    <i class="fas fa-ticket-alt text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Chỉnh sửa vé đặt</h1>
                <p class="text-gray-500 text-sm mt-1">Hồ bơi: <span class="font-bold text-blue-600">{{ dat_ve.ho_boi.ten_ho }}</span></p>
                <p class="text-gray-500 text-xs mt-1">Mã vé: #{{ dat_ve.id }}</p>
            </div>

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="flex flex-col">
                    <label class="text-gray-700 font-medium mb-2 text-sm" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    <div class="[&>input]:w-full [&>input]:p-3 [&>input]:border [&>input]:border-gray-300 [&>input]:rounded-lg [&>input]:focus:ring-2 [&>input]:focus:ring-blue-500 [&>input]:outline-none [&>input]:bg-white [&>input]:text-gray-900">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1 font-medium"><i class="fas fa-exclamation-circle mr-1"></i>{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="pt-6">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition shadow-md">
                        <i class="fas fa-save mr-2"></i>Lưu Thay Đổi
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
